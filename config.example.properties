# Free My TV settings. build.sh copies this file to config.properties the first time; edit that one and rebuild.

# Free key from https://www.themoviedb.org/settings/api (the "API Read Access Token" or the "API Key").
# Without it, the home screen still works, just without the trending picks.
tmdb_key=

# Your country (two letters): decides which titles are on which streaming app. US, GB, CA, BR, DE, FR...
tmdb_region=US

# Your city, for the weather and the sunset that turns the home screen dark at night (decimal degrees).
latitude=40.7128
longitude=-74.0060
# Optional: the name shown on the weather card (empty = "Weather").
city=

# true leaves cartoons and anime (TMDB's Animation genre) out of the picks.
hide_animation=false

# auto (follows the TV), en, es, pt, ru, or de (on Google TV)
language=auto

# true shows cryptocurrency prices from Binance on the home screen and screensaver.
show_crypto=true

# Crypto prices: USD, BRL, EUR... (used only when show_crypto=true)
# (a currency Binance has no pairs in, like INR, shows the prices in dollars)
currency=USD

# C, F, or auto (Fahrenheit when the TV is set to the US)
temperature=auto

# true also turns off Google Assistant ("Ok Google"); the remote's mic button stops working
disable_assistant=false

# Optional: a free Watchmode key (watchmode.com) makes the picks open the title's own page in its app (Prime Video,
# JioHotstar...), not just the app. Without it, they open the app. Keep it private.
watchmode_key=

# ---- Ultra Samsung TV ----

# Optional: the hub on your computer (hub/ in this repo): reminders, trailers, phone remote, Spotify, send to TV.
# Its address on your network, e.g. http://192.168.1.20:3020 (reserve that IP in your router).
hub_url=

# Optional: a page that plays YouTube trailers (YouTube refuses to play inside the app itself). Empty = the hub's.
trailer_page=

# Optional: guests' Wi-Fi as a QR code in the drawer. The password only goes into the QR picture.
wifi_ssid=
wifi_password=

# Optional: Voice Monkey (voicemonkey.io) trigger URLs for Alexa routines: movie night, a goal, 10 min before a game.
# They carry a token: keep them private.
voice_monkey_url=
voice_monkey_goal_url=
voice_monkey_pregame_url=

# Optional: your team, for the live score on the Dynamic Island, goals, pre-game and the table.
# team_espn_id: the number in the team's ESPN page URL (espn.com.br/futebol/time/_/id/874/corinthians → 874).
# team_leagues: ESPN league codes, comma-separated (bra.1, bra.2, bra.copa_do_brazil, conmebol.libertadores...).
# team_schedule_url: optional, the team's "agenda de jogos" page on ge.globo.com, for where each game is on.
team_espn_id=
team_abbr=
team_name=
team_nickname=
team_leagues=bra.1
team_schedule_url=

# Optional: your name, for the greeting ("Boa noite, Ana"). Empty = "For You".
name=
