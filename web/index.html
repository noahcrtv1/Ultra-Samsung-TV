<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Free My TV</title>
<link rel="stylesheet" href="home.css">
</head>
<body>
<div id="stage">
  <div id="sky" class="layer">
    <div class="grad day"></div>
    <div class="grad night"></div>
    <canvas id="bgA" width="48" height="27"></canvas>
    <canvas id="bgB" width="48" height="27"></canvas>
    <div class="veil"></div>
    <div class="mood"></div>
    <div id="rain"></div>
    <div class="lift"></div>
  </div>
  <div id="home" class="layer">
    <div id="top" class="layer">
      <h1 id="title"></h1>
      <div id="tabs"></div>
      <div id="quotes"></div>
      <div id="buttons"></div>
      <div id="cards"></div>
      <div id="stats"></div>
      <div id="verse"></div>
      
      <div id="empty"></div>
      <div id="clock"><span class="time"></span><span class="date"></span></div>
    </div>
    <div id="platter"></div>
    <div id="tiles"></div>
  </div>
  <div id="drawer" class="layer"></div>
  <div id="apps" class="layer sheet"><h2></h2><div class="grid"></div></div>
  <div id="settings" class="layer sheet"><div class="box"></div></div>
  <div id="shelfedit" class="layer sheet"><div class="box"></div></div>
  <div id="detail" class="layer sheet"></div>
  <div id="search" class="layer sheet"></div>
  <div id="panel" class="layer sheet"><div class="box"></div></div>
  <div id="saver" class="layer"></div>
  <div id="reminder"></div>
  <canvas id="islandfx" width="1920" height="260"></canvas>
  <div id="island"></div>
  <div id="welcome"></div>
  <div id="stillthere"></div>
  <div id="fun"></div>
  <div id="player"></div>
  <div id="toast"></div>
</div>
<script src="$WEBAPIS/webapis/webapis.js"></script>
<script src="config.js"></script>
<script src="coins.js"></script>
<script src="strings.js"></script>
<script src="tv.js"></script>
<script src="zones.js"></script>
<script src="data.js"></script>
<script src="plus.js"></script>
<script src="home.js"></script>
<script src="more.js"></script>
<script src="fun.js"></script>
</body>
</html>
