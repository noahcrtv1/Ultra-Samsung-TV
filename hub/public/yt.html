<!doctype html>
<html><head><meta charset="utf-8"><meta name="referrer" content="strict-origin-when-cross-origin">
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}iframe{position:absolute;left:-12%;top:-16%;width:124%;height:132%;border:0;pointer-events:none}</style>
</head><body><script>
var q = new URLSearchParams(location.search), v = (q.get('v') || '').replace(/[^\w-]/g, '');
var f = document.createElement('iframe');
f.allow = 'autoplay; encrypted-media';
f.src = 'https://www.youtube.com/embed/' + v + '?autoplay=1&controls=0&modestbranding=1&rel=0&playsinline=1&iv_load_policy=3&loop=1&playlist=' + v
  + (q.get('sound') ? '' : '&mute=1') + '&origin=' + encodeURIComponent(location.origin);
document.body.appendChild(f);
</script></body></html>
